const OVR={"abfliegen":"F","der Abflug":"F","geöffnet":"O","geschlossen":"S","weg sein":"S","zu sein":"S","zum Beispiel / z. B.":"B"};
const fold=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const letterOf=h=>{if(OVR[h])return OVR[h];let t=h.replace(/^\((sich|Kredit-?)\)\s*/i,"").replace(/^(der|die|das)\s+/i,"").replace(/^\(.*?\)\s*/,"");let c=fold(t).charAt(0).toUpperCase();return c||"#"};
const DATA=RAW.map((r,i)=>({i,hw:r[0],de:r[1],en:r[2],lit:r[3],L:letterOf(r[0]),n:fold(r.join(" "))}));
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let order=DATA.slice(),terms=[];
function hl(s){if(!terms.length)return esc(s);const re=new RegExp("("+terms.map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","ig");return esc(s).replace(re,"<mark>$1</mark>")}
function card(d){return `<div class="s"><div class="hw">${hl(d.hw)}</div><div class="de"><span>${hl(d.de)}</span><button class="say" title="Listen" data-t="${esc(d.de)}">🔊</button></div><div class="en"><span class="tag">EN</span><span class="t">${hl(d.en)}</span></div><div class="lit"><span class="tag">Literal</span><span class="t">${hl(d.lit)}</span></div></div>`}
function render(){
 const raw=$("q").value.trim();terms=raw.split(/\s+/).filter(Boolean);
 const ft=terms.map(fold);
 const res=order.filter(d=>ft.every(t=>d.n.includes(t)));
 $("count").textContent=res.length+" / "+DATA.length+" sentences";
 const grouped=order===DATA||order.alphabetical;
 let html="",cur="";const letters=new Set();
 if(!res.length)html='<div class="none">No sentences found.</div>';
 else if(shuffled){html=res.map(card).join("")}
 else for(const d of res){if(d.L!==cur){cur=d.L;letters.add(cur);html+=`<h2 class="L" id="L${cur}">${cur}</h2>`}html+=card(d)}
 $("list").innerHTML=html;
 if(!shuffled)buildLetters(letters);else $("letters").innerHTML="";
}
function buildLetters(set){$("letters").innerHTML=[...set].map(l=>`<a href="#L${l}">${l}</a>`).join("")}
let shuffled=false;
$("q").addEventListener("input",render);
$("shuf").onclick=()=>{shuffled=true;order=DATA.slice().sort(()=>Math.random()-.5);render()};
$("az").onclick=()=>{shuffled=false;order=DATA.slice();render()};
const main=$("list");
function applyT(){main.classList.toggle("hide-en",!$("tEn").checked);main.classList.toggle("hide-lit",!$("tLit").checked);main.classList.toggle("cover",$("tCover").checked)}
["tEn","tLit","tCover"].forEach(id=>$(id).addEventListener("change",applyT));
main.addEventListener("click",e=>{
 const b=e.target.closest(".say");
 if(b){if("speechSynthesis" in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.t);u.lang="de-DE";u.rate=.85;speechSynthesis.speak(u)}return}
 if(main.classList.contains("cover")){const s=e.target.closest(".s");if(s)s.classList.toggle("open")}
});
applyT();render();
