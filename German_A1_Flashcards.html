<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German A1 Trainer – Flashcards & Quiz</title>
<style>
:root{
  --bg:#f4f5fb;--panel:#ffffff;--text:#1d2033;--muted:#6b7090;--line:#e3e5f1;
  --accent:#4f46e5;--accent2:#7c3aed;--good:#16a34a;--goodbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;
  --der:#2563eb;--die:#db2777;--das:#059669;--shadow:0 10px 30px rgba(40,40,90,.12);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12131c;--panel:#1b1d2b;--text:#eceef8;--muted:#9a9fc0;--line:#2c2f45;
  --goodbg:#12361f;--badbg:#431a1a;--shadow:0 10px 30px rgba(0,0,0,.45);--der:#60a5fa;--die:#f472b6;--das:#34d399;}
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:22px 16px 8px;text-align:center}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 22px;border-radius:999px;font-size:1rem;font-weight:600;cursor:pointer}
.tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:14px}
select,input[type=number]{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:.95rem}
label.chk{display:flex;gap:6px;align-items:center;font-size:.92rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.btn.good{background:var(--goodbg);color:var(--good);border-color:transparent}
.btn.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.counter{text-align:center;color:var(--muted);font-size:.9rem;margin:6px 0 12px}
.scene{perspective:1200px;height:300px;margin:0 auto 16px;max-width:560px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--panel),color-mix(in srgb,var(--accent) 10%,var(--panel)))}
.word{font-size:2.3rem;font-weight:700;line-height:1.2;word-break:break-word}
.word.long{font-size:1.5rem}
.art{font-weight:700}.art.der{color:var(--der)}.art.die{color:var(--die)}.art.das{color:var(--das)}
.tag{position:absolute;top:14px;left:16px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);max-width:60%;text-align:left}
.type{position:absolute;top:12px;right:14px;font-size:.72rem;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--muted);font-weight:600}
.hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.speak{position:absolute;bottom:10px;right:12px;border:none;background:var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.field{margin:16px 0}.field>span{display:block;font-weight:700;margin-bottom:4px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.q{text-align:center;margin:10px 0 20px}
.q small{display:block;color:var(--muted);margin-bottom:6px;font-size:.85rem}
.q .word{font-size:2rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.word{font-size:1.9rem}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:1rem;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line);color:var(--muted);display:grid;place-items:center;font-size:.78rem}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.feedback{min-height:48px;margin:16px 0 8px;text-align:center;font-weight:600}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.score{font-size:3.2rem;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.missed{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin:14px 0}
.missed div{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:.95rem}
.missed div:last-child{border:none}
.missed span:last-child{color:var(--muted);text-align:right}
.center{text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🇩🇪 German A1 Trainer</h1>
  <div class="sub" id="stats"></div>
</header>
<div class="tabs">
  <button class="active" data-tab="cards">🃏 Flashcards</button>
  <button data-tab="quiz">🎮 Quiz game</button>
</div>

<main>
<!-- FLASHCARDS -->
<section id="cards">
  <div class="bar">
    <select id="fcCat" aria-label="Category"></select>
    <select id="fcDir" aria-label="Direction">
      <option value="de">Front: German</option>
      <option value="en">Front: English</option>
    </select>
    <label class="chk"><input type="checkbox" id="hideKnown"> Hide known</label>
    <button class="btn" id="shuffleBtn">🔀 Shuffle</button>
  </div>
  <div class="counter" id="fcCounter"></div>
  <div class="scene"><div class="card" id="card">
    <div class="face front"><div class="tag" id="fTag"></div><div class="type" id="fType"></div><div class="word" id="fWord"></div><div class="hint">Click card to flip</div></div>
    <div class="face back"><div class="tag" id="bTag"></div><div class="type" id="bType"></div><div class="word" id="bWord"></div><button class="speak" id="speakBtn" title="Pronounce">🔊</button></div>
  </div></div>
  <div class="row">
    <button class="btn" id="prevBtn">← Prev</button>
    <button class="btn bad" id="againBtn">✗ Still learning</button>
    <button class="btn good" id="knownBtn">✓ I know it</button>
    <button class="btn" id="nextBtn">Next →</button>
  </div>
  <div class="counter">Keyboard: ← → to move, Space to flip, K = known</div>
  <div class="center"><button class="btn" id="resetKnown">Reset my progress</button></div>
</section>

<!-- QUIZ -->
<section id="quiz" hidden>
  <div class="panel" id="setup">
    <h2 style="margin-top:0">Set up your quiz</h2>
    <div class="field"><span>Number of questions</span>
      <div class="chips" id="numChips"></div>
      <input type="number" id="numInput" min="1" value="10"> <span id="poolInfo" style="display:inline;font-weight:400;color:var(--muted)"></span>
    </div>
    <div class="field"><span>Category</span><select id="qCat"></select></div>
    <div class="field"><span>Question type</span>
      <select id="qDir">
        <option value="de">German → English</option>
        <option value="en">English → German</option>
        <option value="mix">Mixed</option>
      </select>
    </div>
    <button class="btn primary" id="startQuiz" style="width:100%;padding:14px">Start quiz</button>
  </div>

  <div id="play" hidden>
    <div class="qhead"><span id="qNum"></span><span id="qScore"></span></div>
    <div class="prog"><i id="qProg"></i></div>
    <div class="panel">
      <div class="q"><small id="qPrompt"></small><div class="word" id="qWord"></div></div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback"></div>
      <div class="row"><button class="btn" id="qSpeak">🔊 Hear German</button><button class="btn primary" id="qNext" disabled>Next →</button></div>
    </div>
  </div>

  <div class="panel" id="result" hidden>
    <div class="center">Your score</div>
    <div class="score" id="rScore"></div>
    <div class="center" id="rMsg" style="font-weight:600"></div>
    <div id="rMissedWrap">
      <h3>Words to review</h3>
      <div class="missed" id="missed"></div>
    </div>
    <div class="row">
      <button class="btn primary" id="retryMissed">Retry missed words</button>
      <button class="btn" id="newQuiz">New quiz</button>
    </div>
  </div>
</section>
</main>

/* ====== PARSE ====== */
const pool=[], cats=[], seen=new Set();
(function(){
  let cur='';
  RAW.split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line[0]==='#'){cur=line.slice(1).trim();cats.push(cur);return;}
    const i=line.indexOf('|'); const de=line.slice(0,i).trim(), en=line.slice(i+1).trim();
    if(seen.has(de)) return; seen.add(de);
    const m=de.match(/^(der|die|das) /);
    let type='word';
    if(m) type='noun'; else if(/^to /.test(en)||/^(können|müssen|dürfen|sollen|wollen|mögen|möchten)$/.test(de)) type='verb';
    else if(cur.indexOf('Phrases')>-1||/[!?.]$/.test(de)||de.split(' ').length>3) type='phrase';
    pool.push({id:pool.length,de,en,cat:cur,type,art:m?m[1]:null});
  });
})();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function deHTML(c){const m=c.de.match(/^(der|die|das) (.+)$/);return m?`<span class="art ${m[1]}">${m[1]}</span> ${esc(m[2])}`:esc(c.de);}

function buildDeck(keepShuffle){
  const cat=$('#fcCat').value, hide=$('#hideKnown').checked;
  deck=pool.filter(c=>(cat==='all'||c.cat===cat)&&!(hide&&known.has(c.id)));
  if(keepShuffle) deck=shuffle(deck);
  idx=0;renderCard(true);
}
function renderCard(instant){
  const n=deck.length;
  $('#fcCounter').textContent=n?`Card ${idx+1} of ${n}`:'No cards here – clear "Hide known" or pick another category.';
  const c=deck[idx];
  const apply=()=>{
    if(!c){$('#fWord').textContent='🎉';$('#bWord').textContent='';return;}
    const deFirst=$('#fcDir').value==='de';
    const f=deFirst?deHTML(c):esc(c.en), b=deFirst?esc(c.en):deHTML(c);
    $('#fWord').innerHTML=f;$('#bWord').innerHTML=b;
    $('#fWord').className='word'+(f.length>40?' long':'');$('#bWord').className='word'+(b.length>40?' long':'');
    ['fTag','bTag'].forEach(id=>$('#'+id).textContent=c.cat);
    ['fType','bType'].forEach(id=>$('#'+id).textContent=(known.has(c.id)?'✓ ':'')+typeLabel[c.type]);
  };
  if(instant){card.style.transition='none';card.classList.remove('flipped');void card.offsetWidth;apply();card.style.transition='';}
  else apply();
}

function overlap(a,b){a=a.toLowerCase();b=b.toLowerCase();return a===b||a.includes(b)||b.includes(a);}
function makeOptions(c,dir){
  const key=dir==='de'?'en':'de';
  const scored=[];
  for(const o of pool){
    if(o===c) continue;
    if(overlap(o[key],c[key])||overlap(o.en,c.en)) continue;
    let s=Math.random()*2;
    if(o.type===c.type)s+=4;
    if(o.cat===c.cat)s+=3;
    if(c.art&&o.art===c.art)s+=2;
    s-=Math.abs(o[key].length-c[key].length)/5;
    if(key==='de'&&o.de[0].toLowerCase()===c.de[0].toLowerCase())s+=1;
    if(key==='en'&&o.en.split(' ')[0]===c.en.split(' ')[0])s+=1.5;
    scored.push([s,o]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  const out=[],used=new Set([c[key].toLowerCase()]);
  for(const [,o] of scored){const k=o[key].toLowerCase();if(used.has(k))continue;used.add(k);out.push(o);if(out.length===5)break;}
  return shuffle([c,...out]).map(o=>({card:o,text:o[key],correct:o===c}));
}
let Q={qs:[],i:0,score:0,wrong:[],done:false,dir:'de'};
function startQuiz(list,dirSel){
  Q={qs:list.map(c=>({c,dir:dirSel==='mix'?(Math.random()<.5?'de':'en'):dirSel})),i:0,score:0,wrong:[],done:false,dirSel};
  $('#setup').hidden=true;$('#result').hidden=true;$('#play').hidden=false;showQ();
}
$('#startQuiz').onclick=()=>{
  const p=qPool();let n=parseInt($('#numInput').value)||10;n=Math.max(1,Math.min(n,p.length));
  startQuiz(shuffle(p).slice(0,n),$('#qDir').value);
};
function showQ(){
  const {c,dir}=Q.qs[Q.i];
  $('#qNum').textContent=`Question ${Q.i+1} of ${Q.qs.length}`;
  $('#qScore').textContent=`Score: ${Q.score}`;
  $('#qProg').style.width=(Q.i/Q.qs.length*100)+'%';
  $('#qPrompt').textContent=dir==='de'?'What does this mean in English?':'How do you say this in German?';
  $('#qWord').innerHTML=dir==='de'?deHTML(c):esc(c.en);
  $('#qWord').className='word'+((dir==='de'?c.de:c.en).length>34?' long':'');
  $('#qSpeak').hidden=dir!=='de';
  const opts=makeOptions(c,dir);Q.cur=opts;Q.answered=false;
  $('#opts').innerHTML=opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${k+1}</b><span>${esc(o.text)}</span></button>`).join('');
  $$('#opts .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $('#feedback').textContent='';$('#feedback').className='feedback';
  $('#qNext').disabled=true;$('#qNext').textContent=Q.i===Q.qs.length-1?'Finish ✓':'Next →';
}
function answer(k){
  if(Q.answered)return;Q.answered=true;
  const {c,dir}=Q.qs[Q.i];const btns=$$('#opts .opt');
  btns.forEach((b,j)=>{b.disabled=true;if(Q.cur[j].correct)b.classList.add('right');});
  const ok=Q.cur[k].correct;
  if(ok)Q.score++;else{btns[k].classList.add('wrong');Q.wrong.push(c);}
  const fb=$('#feedback');fb.className='feedback '+(ok?'ok':'no');
  fb.textContent=(ok?'✓ Correct!  ':'✗ Not quite.  ')+c.de+'  =  '+c.en;
  $('#qScore').textContent=`Score: ${Q.score}`;
  $('#qNext').disabled=false;
  if(ok&&dir==='de')speak(c.de);
}
function nextQ(){
  if($('#qNext').disabled)return;
  if(Q.i>=Q.qs.length-1)return finish();
  Q.i++;showQ();
}
$('#qNext').onclick=nextQ;
$('#qSpeak').onclick=()=>speak(Q.qs[Q.i].c.de);
function finish(){
  $('#qProg').style.width='100%';$('#play').hidden=true;$('#result').hidden=false;
  const n=Q.qs.length,p=Math.round(Q.score/n*100);
  $('#rScore').textContent=`${Q.score} / ${n}  (${p}%)`;
  $('#rMsg').textContent=p===100?'Perfekt! 🏆':p>=80?'Sehr gut! 🎉':p>=60?'Gut gemacht – keep going! 💪':'Keep practising – you will get there! 📚';
  const uniq=[...new Set(Q.wrong)];
  $('#rMissedWrap').hidden=!uniq.length;
  $('#missed').innerHTML=uniq.map(c=>`<div><span>${deHTML(c)}</span><span>${esc(c.en)}</span></div>`).join('');
  $('#retryMissed').hidden=!uniq.length;Q.missed=uniq;
}
$('#retryMissed').onclick=()=>startQuiz(shuffle(Q.missed),Q.dirSel);
$('#newQuiz').onclick=()=>{$('#result').hidden=true;$('#play').hidden=true;$('#setup').hidden=false;};

/* ====== KEYBOARD ====== */
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(!$('#cards').hidden){
    if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
    else if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.toggle('flipped');}
    else if(e.key.toLowerCase()==='k')$('#knownBtn').click();
  }else if(!$('#play').hidden){
    if(/^[1-6]$/.test(e.key))answer(+e.key-1);
    else if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();nextQ();}
  }
});
</script>
</body>
</html>
